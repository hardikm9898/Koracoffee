name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (lint-equivalent + test)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URI: mongodb://localhost:27017/coffee-ecommrece
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      ADMIN_PHONE_NUMBERS: "9000000001"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # No lint script exists on the backend yet (see project-context/known-limitations.md)
      # — `node --check` on every source file is a cheap syntax gate in the
      # meantime, catching the same class of error a linter's parse step would.
      - run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
      - run: npm test

  frontend:
    name: Customer frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/frontend/package-lock.json
      - run: npm ci
      # Non-blocking for now: several pre-existing lint errors (a
      # react-hooks/set-state-in-effect pattern repeated across a handful of
      # files, predating this workflow) would otherwise turn every run red
      # regardless of what a given PR actually changed. See
      # project-context/known-limitations.md. `npm run build` below is the
      # real gate — it fails on any actual type/compile error.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build

  admin-frontend:
    name: Admin frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end/admin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/admin-frontend/package-lock.json
      - run: npm ci
      # Non-blocking for now: several pre-existing lint errors (a
      # react-hooks/set-state-in-effect pattern repeated across a handful of
      # files, predating this workflow) would otherwise turn every run red
      # regardless of what a given PR actually changed. See
      # project-context/known-limitations.md. `npm run build` below is the
      # real gate — it fails on any actual type/compile error.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
